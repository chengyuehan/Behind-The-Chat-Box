function App() {
  // station line-up comes LIVE from the server; fallback shown until it loads
  const [companies, setCompanies] = useState(() => buildCompanies(FALLBACK_STATIONS));
  const [companyId, setCompanyId] = useState(() => buildCompanies(FALLBACK_STATIONS)[0].id);
  const company = useMemo(
    () => companies.find(c => c.id === companyId) || companies[0],
    [companies, companyId]
  );
  const palette = { body: company.color, dark: company.colorDark };

  // active pumping session: { modelIdx, tokens, cost }
  const [session, setSession] = useState(null); // { idx, tokens, cost, startedAt }
  // robot tank level (units 0..TANK_CAP)
  const [fuelLevel, setFuelLevel] = useState(0);
  // robot brain power (units 0..100) — grows toward the capability of the model fueling it
  const [brainPower, setBrainPower] = useState(0);
  // last model the robot drank — drives the IQ tooltip on brain hover
  const [lastModel, setLastModel] = useState(null); // { name, iq }
  const [iqHover, setIqHover] = useState(false);

  // ---- receipt board + collection ----
  const STORE_KEY = 'aifuel_board_v3';
  const [collected, setCollected] = useState(() => {
    try { return (JSON.parse(localStorage.getItem(STORE_KEY)) || {}).collected || {}; } catch (e) { return {}; }
  });
  const [receipts, setReceipts] = useState(() => {
    try { return (JSON.parse(localStorage.getItem(STORE_KEY)) || {}).receipts || []; } catch (e) { return []; }
  });
  const [pinToast, setPinToast] = useState('');
  const [compareKey, setCompareKey] = useState(null); // model key highlighted in the Compare tab
  const [tab, setTab] = useState('receipts'); // bottom dock tab: receipts | compare | brains
  // per-fill output token quota — controlled by the slider. Drives tokens out,
  // cost & fill time (NOT IQ). Changing it wipes the receipt board.
  const [tokenQuota, setTokenQuota] = useState(() => {
    try { return (JSON.parse(localStorage.getItem(STORE_KEY)) || {}).tokenQuota || TANK_TOKENS; } catch (e) { return TANK_TOKENS; }
  });
  const tokenQuotaRef = useRef(tokenQuota);
  tokenQuotaRef.current = tokenQuota;
  useEffect(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ collected, receipts, tokenQuota })); } catch (e) {}
  }, [collected, receipts, tokenQuota]);

  // LIVE data: pull the real, current catalogue from our server on load.
  // The server fetches LLM Stats + throughput telemetry (no browser CORS).
  const [dataLive, setDataLive] = useState(false);
  const [dataInfo, setDataInfo] = useState(null); // { modelCount, updatedAt }
  useEffect(() => {
    let alive = true;
    const load = (url) => fetch(url, { cache: 'no-store' }).then((res) => (res.ok ? res.json() : Promise.reject(res.status)));
    load(FUEL_API)
      .catch(() => load(FUEL_API_FALLBACK)) // local dev server, if the snapshot is absent
      .then((data) => {
        if (!alive || !data || !data.stations) return;
        const fresh = buildCompanies(data.stations);
        if (!fresh.length) return;
        setCompanies(fresh);
        setCompanyId((cur) => (fresh.find((c) => c.id === cur) ? cur : fresh[0].id));
        setDataLive(!!data.live);
        setDataInfo({ modelCount: data.modelCount, updatedAt: data.updatedAt });
      })
      .catch(() => { /* keep fallback line-up */ });
    return () => { alive = false; };
  }, []);

  const totalModels = useMemo(() => companies.reduce((s, c) => s + c.models.length, 0), [companies]);
  const collectedCount = useMemo(() => Object.keys(collected).length, [collected]);
  const achievements = useMemo(() => buildAchievements(companies, collected), [collected, companies]);

  // build a printed receipt from a finished session
  const makeReceipt = useCallback((sess) => {
    if (!sess || sess.tokens < 5) return null;
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const dateStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}  ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    const txid = (Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36)).toUpperCase().slice(-9);
    // A full fill is a fixed token quota for EVERY model — the robot always needs
    // the same number of output tokens to fill up. What differs per model is the
    // FILL TIME (driven by speed) and the TOTAL (driven by price).
    const tokens = tokenQuotaRef.current;
    const cost = (tokens / 1_000_000) * sess.price;
    const fillTime = tokens / sess.speed; // seconds
    return {
      companyId: sess.companyId, companyName: sess.companyName,
      idx: sess.idx, modelName: sess.modelName,
      speed: sess.speed, isEstSpeed: sess.isEstSpeed, price: sess.price, inPrice: sess.inPrice, iq: sess.iq,
      tokens, cost, fillTime,
      color: sess.color, dateStr, txid,
    };
  }, []);

  // end the active session. A receipt only prints when the tank is FULLY filled
  // (completed === true). A mid-fill stop / switch just ends and resets — no receipt.
  // Each model prints at most ONE receipt: a repeat fill updates the existing one in place.
  const finishSession = useCallback((sess, completed) => {
    setSession(null);
    setFuelLevel(0);          // auto-reset the tank after every fill
    if (!completed) return;
    const r = makeReceipt(sess);
    if (!r) return;
    const key = modelKey(r.companyId, r.modelName);
    const isNew = !collected[key];
    setReceipts((prev) => [r, ...prev.filter((x) => modelKey(x.companyId, x.modelName) !== key)]);
    setCollected((prev) => ({ ...prev, [key]: r }));
    setBrainPower(r.iq);      // robot keeps the IQ of what it just drank
    setLastModel({ name: r.modelName, iq: r.iq });
    setPinToast((isNew ? 'RECEIPT PRINTED ✓  ' : 'RECEIPT UPDATED ✓  ') + r.modelName.toUpperCase());
    setTimeout(() => setPinToast(''), 1900);
  }, [makeReceipt, collected]);

  const clearBoard = useCallback(() => {
    if (window.confirm('Clear the receipt board and collection?')) { setReceipts([]); setCollected({}); }
  }, []);

  // changing the output token amount invalidates every printed receipt → wipe the board
  const changeTokenQuota = useCallback((v) => {
    setTokenQuota(v);
    setReceipts([]);
    setCollected({});
    setSession(null);
    setFuelLevel(0);
  }, []);


  // drag state per pump-index
  const [drag, setDrag] = useState(null); // { idx, pos: {x,y}, offset:{x,y} } in stage coords
  const dragRef = useRef(null);
  // when pumping, store the nozzle's anchor position so the hose visually attaches to port
  const [overPort, setOverPort] = useState(false);

  const stageRef = useRef(null);
  const portRef = useRef(null);

  // Keep the scene at full width (no side letterboxing). Instead of scaling it
  // down — which would make it narrower than the page and reveal black bars —
  // we cap the visible height and crop a little of the bottom ground so the
  // dock's tab bar still fits. The robot + pumps sit well above the crop line.
  const [vh, setVh] = useState(typeof window !== 'undefined' ? window.innerHeight : 900);
  useEffect(() => {
    const on = () => setVh(window.innerHeight);
    window.addEventListener('resize', on);
    return () => window.removeEventListener('resize', on);
  }, []);
  const stageWrapH = Math.max(520, Math.min(STAGE_H, vh - 86)); // reserve ~86px for the tab bar
  const scaleRef = useRef(1); // scene is unscaled (1:1), so drag math is unaffected
  scaleRef.current = 1;

  // pump anchor positions (where the hose exits the pump body) in stage coords
  const [pumpAnchors, setPumpAnchors] = useState({});
  // nozzle holster positions (rest position of nozzle when not in use) per pump idx
  const [holsterPositions, setHolsterPositions] = useState({});

  // measure pump positions (in stage space). getBoundingClientRect is in viewport
  // coords, so this stays correct even when the pump bay is scrolled horizontally.
  const measurePumps = useCallback(() => {
    const stage = stageRef.current;
    if (!stage) return;
    const stageBox = stage.getBoundingClientRect();
    const s = scaleRef.current;
    // The pump bay scrolls horizontally and clips overflowing pumps, but the nozzles
    // are drawn in the stage (so they can be dragged out). Only record anchors for
    // pumps that are actually inside the bay's visible viewport — otherwise a
    // scrolled-out pump's nozzle would float over the robot.
    const bay = stage.querySelector('.pump-bay');
    const bayBox = bay ? bay.getBoundingClientRect() : stageBox;
    const anchors = {};
    const rest = {};
    company.models.forEach((_m, i) => {
      const pumpEl = stage.querySelector(`[data-pump-idx="${i}"]`);
      const holEl  = stage.querySelector(`[data-holster-idx="${i}"]`);
      if (!pumpEl || !holEl) return;
      const hb = holEl.getBoundingClientRect();
      // gate on the NOZZLE (holster) being inside the bay's visible band — a pump can
      // straddle the edge with its holster in the clipped region, which would float
      // the nozzle over the robot.
      const holCenter = (hb.left + hb.right) / 2;
      if (holCenter < bayBox.left + 4 || holCenter > bayBox.right - 4) return;
      const pb = pumpEl.getBoundingClientRect();
      anchors[i] = { x: (pb.right - stageBox.left) / s - 4, y: (pb.top - stageBox.top) / s + 90 };
      rest[i] = { x: (hb.left - stageBox.left) / s - 24, y: (hb.top - stageBox.top) / s - 12 };
    });
    setPumpAnchors(anchors);
    setHolsterPositions(rest);
  }, [company]);
  useEffect(() => { measurePumps(); }, [measurePumps, companyId, stageWrapH, companies]);

  // port position
  const getPortCenter = useCallback(() => {
    const stage = stageRef.current;
    const port  = portRef.current;
    if (!stage || !port) return null;
    const sb = stage.getBoundingClientRect();
    const pb = port.getBoundingClientRect();
    const s = scaleRef.current;
    return { x: (pb.left - sb.left) / s + (pb.width / s) / 2, y: (pb.top - sb.top) / s + (pb.height / s) / 2 };
  }, []);

  const distToPort = useCallback((p) => {
    const c = getPortCenter();
    if (!c || !p) return Infinity;
    const dx = c.x - p.x, dy = c.y - p.y;
    return Math.hypot(dx, dy);
  }, [getPortCenter]);

  // pointer handlers (on stage)
  const onPointerMove = useCallback((e) => {
    const cur = dragRef.current;
    if (!cur) return;
    const sb = stageRef.current.getBoundingClientRect();
    const s = scaleRef.current;
    const x = (e.clientX - sb.left) / s - cur.offset.x;
    const y = (e.clientY - sb.top)  / s - cur.offset.y;
    cur.pos = { x, y };
    setDrag(d => d ? { ...d, pos: { x, y } } : d);
    // check proximity to fuel port (using the spout tip area; tip is near top-left of div)
    setOverPort(distToPort({ x: x + 0, y: y + 7 }) < 44);
  }, [distToPort]);

  const onPointerUp = useCallback(() => {
    const cur = dragRef.current;
    if (!cur) return;
    const tip = cur.pos ? { x: cur.pos.x, y: cur.pos.y + 7 } : null;
    if (tip && distToPort(tip) < 44) {
      const idx = cur.idx;
      const m = company.models[idx];
      // fresh fill: empty the tank and let the brain re-grow from scratch
      setFuelLevel(0);
      setBrainPower(0);
      setSession({
        idx, tokens: 0, cost: 0, startedAt: performance.now(),
        companyId: company.id, companyName: company.name,
        modelName: m.name, speed: m.speed, isEstSpeed: m.isEstSpeed, price: m.price, inPrice: m.inPrice, iq: m.iq, color: palette.body,
      });
    }
    dragRef.current = null;
    setDrag(null);
    setOverPort(false);
  }, [distToPort, company, palette]);

  useEffect(() => {
    if (!drag) return;
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup',   onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    return () => {
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup',   onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
    };
  }, [drag, onPointerMove, onPointerUp]);

  // pumping loop: tick session.tokens & cost based on model speed/price
  useEffect(() => {
    if (!session) return;
    const model = company.models[session.idx];
    let last = performance.now();
    const id = setInterval(() => {
      const now = performance.now();
      const dt = (now - last) / 1000;
      last = now;
      const deltaTokens = model.speed * dt;
      const deltaCost   = (deltaTokens / 1_000_000) * model.price;
      setSession(s => s ? { ...s, tokens: s.tokens + deltaTokens, cost: s.cost + deltaCost } : s);
      setFuelLevel(f => Math.min(TANK_CAP, f + deltaTokens * (TANK_CAP / tokenQuotaRef.current))); // full tank = the chosen token quota
      // brain growth: rate ∝ model capability, capped by capability ceiling.
      // stronger model => grows faster AND reaches a bigger brain.
      const ceiling = model.iq;
      const rate = (model.iq / 100) * 26; // units per second
      setBrainPower(b => b < ceiling ? Math.min(ceiling, b + rate * dt) : b);
    }, 60);
    return () => clearInterval(id);
  }, [session && session.idx, company]); // eslint-disable-line

  // auto-stop if tank full
  useEffect(() => {
    if (fuelLevel >= TANK_CAP && session) {
      finishSession(session, true); // tank full → fill complete → print receipt
    }
  }, [fuelLevel, session, finishSession]);

  const stopPump = () => finishSession(session, false); // manual lift-off — no receipt

  // begin drag
  const beginDrag = (idx, e) => {
    e.preventDefault();
    const sb = stageRef.current.getBoundingClientRect();
    const target = e.currentTarget.getBoundingClientRect();
    const s = scaleRef.current;
    // offset: pointer location relative to nozzle origin (stage space)
    const offset = { x: (e.clientX - target.left) / s, y: (e.clientY - target.top) / s };
    // initial nozzle pos at current location (stage space)
    const pos = { x: (target.left - sb.left) / s, y: (target.top - sb.top) / s };
    const d = { idx, pos, offset };
    dragRef.current = d;
    setDrag(d);
    // if currently pumping this pump, lift the nozzle off mid-fill — no receipt
    if (session && session.idx === idx) finishSession(session, false);
  };

  // ----------------------------------------------------------
  // RENDER
  // ----------------------------------------------------------

  // nozzle position resolver
  const nozzlePos = (idx) => {
    if (drag && drag.idx === idx)        return drag.pos;
    if (session && session.idx === idx) {
      const port = getPortCenter();
      if (port) return { x: port.x - 0, y: port.y - 7 };
    }
    return holsterPositions[idx] || { x: -200, y: -200 };
  };

  const hoseFor = (idx) => {
    const from = pumpAnchors[idx];
    const np = nozzlePos(idx);
    if (!from || !np) return null;
    // hose connects from pump anchor to the nozzle's "knob" location
    const to = { x: np.x + 52, y: np.y + 0 };
    return { from, to, color: palette.body };
  };

  const fmtMoney = (n) => '$' + n.toFixed(n < 0.01 ? 6 : n < 1 ? 4 : 2);
  const fmtTokens = (n) => {
    if (n < 1000) return n.toFixed(0);
    if (n < 1_000_000) return (n/1000).toFixed(2) + 'k';
    return (n/1_000_000).toFixed(3) + 'M';
  };

  return (
    <div className="page">
    <div className="stage-wrap" style={{ height: stageWrapH }}>
    <div className="stage" ref={stageRef}>
      {/* sky atmosphere */}
      <div className="sun-rays" />
      <div className="sun" />
      <CloudsSVG />
      <MountainsSVG />
      <MountainsNearSVG />
      <div className="ground" />
      <div className="road" />
      <div className="island" />
      <div className="canopy-glow" />

      {/* canopy */}
      <div className="canopy">
        <div className="canopy-label">
          <span className="dot" />
          <span>AI&nbsp;&nbsp;FUEL&nbsp;&nbsp;PLAZA</span>
          <span className="canopy-sub">·&nbsp;24H&nbsp;·&nbsp;TIER&nbsp;1&nbsp;·</span>
          <span className={'data-tag' + (dataLive ? ' live' : '')} title={dataLive ? ('Live from LLM Stats · ' + (dataInfo ? dataInfo.modelCount + ' models · ' + new Date(dataInfo.updatedAt).toLocaleTimeString() : '')) : 'Server unreachable — showing fallback'}>
            <i />{dataLive ? ('LIVE · ' + (dataInfo ? dataInfo.modelCount + ' MODELS' : '')) : 'OFFLINE'}
          </span>
        </div>
        <div className="canopy-stripe" />
      </div>

      {/* station selector */}
      <div className="stations-row">
        {companies.map(c => {
          const tint = `${c.color}33`; // 20% alpha-ish
          return (
          <div
            key={c.id}
            className={'station-card' + (c.id === companyId ? ' active' : '')}
            onClick={(e) => { finishSession(session, false); setCompanyId(c.id); e.currentTarget.scrollIntoView({ inline: 'center', block: 'nearest' }); }}
            style={{ '--brand-color': c.color, '--brand-tint': tint }}
          >
            <div className="brand-strip" />
            <div className="brand-glow" />
            <div className="emblem">{c.emblem(40)}</div>
            <div className="scname">{c.name}</div>
            <div className="scsub">{c.models.length} PUMPS</div>
            <div className="pole" />
          </div>
        )})}
      </div>

      {/* pump bay */}
      <div className="pump-bay" onScroll={measurePumps}>
        {company.models.map((m, i) => {
          const isPumping = session && session.idx === i;
          const sessTokens = isPumping ? session.tokens : 0;
          const sessCost   = isPumping ? session.cost   : 0;
          return (
            <div className={'pump' + (isPumping ? ' active' : '')} key={m.name} data-pump-idx={i}>
              <div className="pump-body" style={{ '--pump-color': palette.body, '--pump-color-dark': palette.dark }}>
                <div className="pump-top">{m.name.toUpperCase()}</div>
                <div className="screen">
                  <div style={{display:'flex', justifyContent:'space-between'}}>
                    <span className="lbl">PRICE</span>
                    <span className="lbl">USD</span>
                  </div>
                  <div className="val">{sessCost < 1 ? sessCost.toFixed(4) : sessCost.toFixed(2)}</div>
                  <div style={{display:'flex', justifyContent:'space-between'}}>
                    <span className="lbl">TOKENS</span>
                    <span className="lbl">OUT</span>
                  </div>
                  <div className="val small">{sessTokens.toFixed(0).padStart(7,'0')}</div>
                </div>
                <div className="pump-info">
                  <div className="row"><span className="k">SPEED</span><span className="v" title={m.isEstSpeed ? 'estimated — no published telemetry' : 'real 7-day throughput'}>{m.isEstSpeed ? '~' : ''}{m.speed} t/s</span></div>
                  <div className="row"><span className="k">OUT</span><span className="v">${m.price.toFixed(2)}/M</span></div>
                  <div className="row"><span className="k">IN</span><span className="v">${m.inPrice.toFixed(2)}/M</span></div>
                  <div className="row"><span className="k">IQ</span><span className="v" style={{color:'#f8b4d6'}} title="LLM Stats Score — composite TrueSkill rating across every tracked benchmark">{m.iq}</span></div>
                </div>
                <div className="nozzle-holster" data-holster-idx={i} />
                {isPumping && <button className="stop-btn" onClick={stopPump}>STOP</button>}
              </div>
              <div className="pump-base" />
            </div>
          );
        })}
      </div>

      {/* Robot + fuel port */}
      <div className="robot">
        <Robot fuelLevel={fuelLevel} brainPower={brainPower} glowColor={palette.body} />
        <div className="shadow" />
        {/* hover zone over the brain → shows the robot's IQ */}
        <div
          className="brain-hot"
          onMouseEnter={() => setIqHover(true)}
          onMouseLeave={() => setIqHover(false)}
        />
        {iqHover && (
          <div className="iq-tip">
            <span className="iq-k">ROBOT&nbsp;IQ</span>
            <span className="iq-v">{Math.round(brainPower)}<i>/100</i></span>
            {lastModel
              ? <span className="iq-sub">fueled by {lastModel.name}</span>
              : <span className="iq-sub">tank empty — go fuel up</span>}
          </div>
        )}
        <div
          ref={portRef}
          className={'fuel-port' + ((drag && overPort) ? ' target' : '')}
          style={{ left: 8, top: 178 }}
        />
      </div>

      {/* SVG hose overlay */}
      <svg className="hose-overlay" viewBox={`0 0 ${STAGE_W} ${STAGE_H}`} preserveAspectRatio="none">
        {company.models.map((_m, i) => {
          const h = hoseFor(i);
          if (!h) return null;
          const isActive = session && session.idx === i;
          return <Hose key={i} idKey={`${companyId}-${i}`} from={h.from} to={h.to} color={h.color} active={isActive} />;
        })}
      </svg>

      {/* Nozzles (rendered absolutely over everything) */}
      {company.models.map((_m, i) => {
        const pos = nozzlePos(i);
        if (!pos) return null;
        const isDrag = drag && drag.idx === i;
        const isPump = session && session.idx === i;
        return (
          <div
            key={i}
            className={'nozzle' + (isDrag ? ' dragging' : '') + (isPump ? ' pumping' : '')}
            style={{ left: pos.x, top: pos.y }}
            onPointerDown={(e) => beginDrag(i, e)}
          >
            <NozzleSVG color={palette.dark} active={isPump} />
          </div>
        );
      })}

      {/* toast */}
      {!session && !drag && (
        <div className="toast">
          DRAG A NOZZLE <span className="blink">→</span> ROBOT FUEL PORT · TAP A STATION TO SWITCH
        </div>
      )}
    </div>
    </div>

      {/* ===== Receipt board below the scene ===== */}
      {/* ===== Tabbed collection dock below the scene ===== */}
      <BottomDock
        companies={companies}
        receipts={receipts}
        collected={collected}
        totalCount={totalModels}
        collectedCount={collectedCount}
        achievements={achievements}
        onClear={clearBoard}
        tab={tab}
        setTab={setTab}
        compareKey={compareKey}
        tokenQuota={tokenQuota}
        onTokenQuota={changeTokenQuota}
        onOpenCompare={(r) => { setCompareKey(modelKey(r.companyId, r.modelName)); setTab('compare'); }}
      />

      {pinToast && <div className="pin-toast">{pinToast}</div>}
    </div>
  );
}

// idempotent mount — reuse the root if this script ever re-executes (avoids the
// "createRoot() on a container that has already been passed" dev warning).
const _rootEl = document.getElementById('root');
const _root = _rootEl.__fuelRoot || (_rootEl.__fuelRoot = ReactDOM.createRoot(_rootEl));
_root.render(<App />);

</script>
<template id="__bundler_thumbnail" data-bg-color="#0d111a">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0d111a"/>
    <!-- fuel pump body -->
    <rect x="430" y="250" width="200" height="320" rx="16" fill="#1a2030" stroke="#ff8a3d" stroke-width="6"/>
    <rect x="460" y="290" width="140" height="90" rx="8" fill="#0a0f17" stroke="#3a4a60" stroke-width="3"/>
    <text x="530" y="350" font-family="monospace" font-size="44" font-weight="700" fill="#ff8a3d" text-anchor="middle">$0.00</text>
    <!-- nozzle -->
    <rect x="600" y="430" width="120" height="26" rx="13" fill="#ff8a3d"/>
    <circle cx="740" cy="443" r="22" fill="#ef6f24"/>
    <!-- receipt -->
    <rect x="690" y="500" width="150" height="200" rx="6" fill="#f6f1e6" transform="rotate(6 765 600)"/>
    <line x1="715" y1="545" x2="815" y2="545" stroke="#9a8f7c" stroke-width="3" stroke-dasharray="6 5" transform="rotate(6 765 600)"/>
    <line x1="715" y1="580" x2="815" y2="580" stroke="#9a8f7c" stroke-width="3" stroke-dasharray="6 5" transform="rotate(6 765 600)"/>
