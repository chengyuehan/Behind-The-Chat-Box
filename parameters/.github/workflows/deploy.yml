name: Build & deploy to Pages

on:
  schedule:
    - cron: "0 * * * *"      # hourly (UTC) → refreshes the parameter data. "*/15 * * * *" = every 15 min.
  workflow_dispatch:          # manual refresh from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch parameter data from LLM Stats API
        env:
          LLM_STATS_KEY: ${{ secrets.LLM_STATS_KEY }}
        run: node scripts/fetch-data.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
